name: Deploy Firebase Hosting

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: firebase-hosting-${{ github.event_name == 'push' && 'live' || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Run ESLint
        working-directory: frontend
        run: npm run lint

  test-frontend:
    needs: lint-frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Run tests
        working-directory: frontend
        run: npm test -- --passWithNoTests

  build-static:
    needs: test-frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Build (export estatico)
        working-directory: frontend
        env:
          STATIC_EXPORT: 'true'
          NEXT_PUBLIC_DATA_SOURCE: firestore
          NEXT_PUBLIC_USE_EMULATOR: 'false'
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: felipe-semana6
          NEXT_PUBLIC_FIREBASE_API_KEY: AIzaSyAa2S5HDMjrv59bDGLvGVXBUJnyJ4Cpfr4
        run: npm run build
      - name: Upload do site estatico
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: frontend/out
          if-no-files-found: error

  deploy-preview:
    if: github.event_name == 'pull_request'
    needs: build-static
    runs-on: ubuntu-latest
    permissions:
      checks: write
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - name: Download do site estatico
        uses: actions/download-artifact@v4
        with:
          name: site
          path: frontend/out
      - name: Deploy no canal de pre-visualizacao
        id: deploy
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_FELIPE_SEMANA6 }}
          projectId: felipe-semana6
          expires: 7d
      - name: Teste de fumaca
        run: curl --fail --silent --show-error --location --output /dev/null '${{ steps.deploy.outputs.details_url }}'

  deploy-live:
    if: github.event_name == 'push'
    needs: build-static
    runs-on: ubuntu-latest
    permissions:
      checks: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Download do site estatico
        uses: actions/download-artifact@v4
        with:
          name: site
          path: frontend/out
      - name: Deploy em producao
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_FELIPE_SEMANA6 }}
          projectId: felipe-semana6
          channelId: live
      - name: Teste de fumaca
        run: curl --fail --silent --show-error --location --output /dev/null 'https://felipe-semana6.web.app'